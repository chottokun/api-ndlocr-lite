[project]
name = "api-ndlocr-lite"
version = "0.1.0"
description = "OpenAI-compatible OCR API server based on NDLOCR-Lite, optimized for LibreChat, Code Interpreter, and secure sandbox environments."
readme = "README.md"
keywords = ["librechat", "code-interpreter", "sandbox", "fastapi"]
requires-python = ">=3.13"
dependencies = [
    "dill==0.3.8",
    "fastapi>=0.133.1",
    "lxml>=6.1.3",
    "networkx==3.3",
    "numpy==2.2.2",
    "onnxruntime>=1.31.1",
    "ordered-set==4.1.0",
    "pillow>=13.0.0",
    "protobuf>=6.33.6",
    "pyparsing==3.1.2",
    "pypdfium2==4.30.0",
    "python-multipart>=0.0.31",
    "pyyaml==6.0.1",
    "reportlab==4.2.5",
    "tqdm==4.66.4",
    "uvicorn>=0.41.0",
    "opencv-python-headless",
    "defusedxml>=0.7.1",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "httpx>=0.28.1",
    "locust>=2.43.3",
    "pip-audit>=2.9.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "streamlit>=1.42.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
