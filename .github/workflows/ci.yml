name: Docker CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # 毎週月曜 03:00 UTC に定期的な脆弱性スキャンを実行する
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  unit-and-security-tests:
    name: ユニット・統合・脆弱性テスト
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: uv と Python 環境のセットアップ
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: 依存関係のインストール
        run: uv sync --frozen

      - name: pytest の実行（ユニット・統合・セキュリティテスト）
        run: PYTHONPATH=. uv run pytest -v

  security-scan:
    name: セキュリティ・脆弱性スキャン
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v6

      - name: uv と Python 環境のセットアップ
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: 依存関係のインストール
        run: uv sync --frozen

      - name: Bandit による静的セキュリティ解析 (SAST)
        run: uv run bandit -r src/ -ll

      - name: pip-audit による依存パッケージ脆弱性スキャン
        run: uv run pip-audit --desc off

  docker-integration-test:
    name: Docker ビルド・脆弱性スキャン・結合テスト
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Docker Buildx のセットアップ
        uses: docker/setup-buildx-action@v3

      - name: Docker イメージのビルド
        run: docker build -t api-ndlocr-lite:latest .

      - name: Trivy によるコンテナイメージ脆弱性スキャン
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'api-ndlocr-lite:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: API コンテナの起動
        run: docker run -d --name ndlocr-api -p 8001:8000 api-ndlocr-lite:latest

      - name: API のヘルスチェック待機
        run: |
          echo "API 起動を待機中..."
          for i in {1..12}; do
            if curl -s -f http://localhost:8001/health; then
              echo "API は正常に起動しました"
              exit 0
            fi
            echo "待機中... ($i/12)"
            sleep 5
          done
          echo "エラー: API がタイムアウトまでに起動しませんでした。"
          docker logs ndlocr-api
          exit 1

      - name: API スモークテスト（ヘルスチェック・OCR 推論）
        run: |
          HEALTH_STATUS=$(curl -s -f http://localhost:8001/health)
          echo "Health response: $HEALTH_STATUS"
          if [[ "$HEALTH_STATUS" != *"ok"* ]]; then
            echo "ヘルスチェックレスポンスが不正です"
            exit 1
          fi

          OCR_RESPONSE=$(curl -s -f -X POST \
            -F "file=@extern/ndlocr-lite/resource/digidepo_3048008_0025.jpg" \
            http://localhost:8001/v1/ocr)
          echo "OCR response snippet: ${OCR_RESPONSE:0:300}"
          if [[ "$OCR_RESPONSE" != *"第8章"* ]]; then
            echo "OCR レスポンスに期待される文字列が含まれていません"
            exit 1
          fi

      - name: コンテナの停止と削除
        if: always()
        run: |
          docker stop ndlocr-api || true
          docker rm ndlocr-api || true
